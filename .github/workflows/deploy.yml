name: Deploy to GitHub Pages

on:
  push:
    branches: [release]
  workflow_dispatch:

concurrency:
  group: gh-pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Build site
        run: |
          mkdir _site
          cp -r index.html css fonts img js _site/

      # Replaces the gh-pages contents with _site and adds .nojekyll, so Pages serves the files as-is.
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          commit_message: 'Deploy ${{ github.sha }}'
